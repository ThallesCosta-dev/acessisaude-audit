# =============================================================================
# Catálogo de alvos — AcessiSaúde-Audit
# =============================================================================
# Este arquivo é o desenho amostral do estudo, não um arquivo de configuração.
# Cada alvo precisa declarar POR QUE integra a amostra (`selection_rationale`),
# sob pena de a seção de Métodos do artigo ficar sem justificativa.
#
# REGRA DE CONDUTA (ver docs/metodologia/etica-e-conduta-de-coleta.md):
#   Todos os alvos de produção nascem com `enabled: false`. Habilitá-los é uma
#   decisão consciente do pesquisador, que assume: (a) respeito ao robots.txt,
#   (b) intervalo mínimo entre requisições, (c) identificação no User-Agent,
#   (d) ausência de qualquer tentativa de autenticação ou submissão de dados.
#
#   A ferramenta NUNCA preenche formulários, NUNCA autentica e NUNCA envia
#   dados. Ela lê o DOM renderizado de páginas públicas — nada além disso.
#
# VERIFICAÇÃO DE URL:
#   As URLs abaixo devem ser conferidas manualmente antes de qualquer coleta.
#   Endereços de portais públicos mudam com frequência; uma URL desatualizada
#   produz erro de navegação, não um achado de acessibilidade.
# =============================================================================

version: "2"
description: >-
  Plataformas digitais de saúde pública com incidência no município e no estado
  do Rio de Janeiro, estratificadas por esfera federativa e por natureza do
  serviço prestado.
collection_window: "2026-08-16 (janela única; verificação de URLs em 2026-08-16)"

# =============================================================================
# REGISTRO DE VERIFICAÇÃO — 16/08/2026
# =============================================================================
# Todas as URLs foram conferidas manualmente antes da habilitação. A verificação
# produziu quatro correções e um achado metodológico, todos registrados aqui
# porque afetam a interpretação da amostra:
#
# 1. saude.rj.gov.br era um STUB. A raiz servia 935 bytes de HTML com
#    `window.location.replace` para www.rj.gov.br/saude — e, ironicamente, com
#    `<html lang="en">`. O portal institucional da SES-RJ foi reapontado; os
#    serviços ao cidadão permanecem no subdomínio antigo, de modo que o alvo
#    legitimamente abrange dois hosts do mesmo órgão.
#
# 2. prefeitura.rio/saude/ NÃO é um portal de serviços. Seu título é "Arquivos
#    Saúde": é a seção de notícias da SMS. Os serviços transacionais municipais
#    ficam em carioca.rio. Mantido como alvo informacional, com a natureza
#    corrigida, e acrescentado carioca.rio como alvo transacional municipal.
#
# 3. prefeitura.rio/saude/clinicas-da-familia/ estava morta: redirecionava para
#    uma matéria jornalística de 2024. Removida.
#
# 4. subpav.org mudou de função. Ambas as sementes redirecionavam para
#    subpav.org/aps/, hoje descrito como "repositório de conteúdo técnico" —
#    dirigido a profissionais, não ao cidadão. DESABILITADO e mantido no
#    catálogo com a justificativa, por ser informação relevante sobre o
#    ecossistema: um canal antes voltado ao usuário deixou de sê-lo.
#
# 5. meususdigital.saude.gov.br serve a mesma casca de 1418 bytes em toda rota,
#    inclusive em /robots.txt. É uma aplicação de página única em Angular: o
#    conteúdo só existe após execução de JavaScript. Consequências: (a) não há
#    robots.txt efetivo, e a política do projeto trata ausência como permissão;
#    (b) a auditoria depende inteiramente da renderização, o que valida a opção
#    por navegador real em vez de análise de HTML servido.
# =============================================================================

targets:

  # ---------------------------------------------------------------------------
  # 1. Conjunto de validação interna (sintético). Sempre habilitado.
  # ---------------------------------------------------------------------------
  - id: fixtures-local
    name: "Conjunto de validação sintético (golden set)"
    organization: "AcessiSaúde-Audit — páginas de teste do próprio projeto"
    sphere: federal
    categories: [informacional, agendamento]
    base_url: "http://127.0.0.1:8080"
    territory: "n/a — ambiente controlado"
    enabled: true
    selection_rationale: >-
      Páginas construídas com violações WCAG conhecidas e documentadas, usadas
      para aferir sensibilidade e especificidade do motor antes de qualquer
      afirmação sobre portais reais. Sem esta etapa, não há como distinguir
      "o portal está ruim" de "o detector está errado".
    tags: [validacao, sintetico, ci]
    seeds:
      - url: "http://127.0.0.1:8080/pages/inacessivel-agendamento.html"
        label: "Agendamento com barreiras severas (caso-controle positivo)"
        critical: true
      - url: "http://127.0.0.1:8080/pages/acessivel-agendamento.html"
        label: "Agendamento conforme (caso-controle negativo)"
        critical: true
      - url: "http://127.0.0.1:8080/pages/contraste-e-cor.html"
        label: "Falhas isoladas de contraste e uso de cor"
      - url: "http://127.0.0.1:8080/pages/formulario-sem-rotulos.html"
        label: "Formulário sem rótulos programáticos"
        critical: true
      - url: "http://127.0.0.1:8080/pages/pagina-pesada.html"
        label: "Página onerosa em dados móveis"

  # ---------------------------------------------------------------------------
  # 2. Esfera federal
  # ---------------------------------------------------------------------------
  - id: conecte-sus-web
    name: "Meu SUS Digital (Conecte SUS) — versão web"
    organization: "Ministério da Saúde / DATASUS"
    sphere: federal
    categories: [prontuario, resultado_exame, cadastro]
    base_url: "https://meususdigital.saude.gov.br"
    territory: "Brasil (uso nacional)"
    population_served: 203000000
    enabled: true
    selection_rationale: >-
      Principal porta de entrada digital do cidadão ao SUS e repositório do
      histórico clínico individual. É o caso em que a inacessibilidade produz o
      dano mais direto ao direito à saúde, por envolver dado clínico próprio.
    robots_note: >-
      Verificado em 16/08/2026: /robots.txt devolve a casca da aplicação (HTML,
      1418 bytes), não um arquivo de exclusão. Não há diretiva efetiva; a
      política do projeto trata ausência de robots.txt como permissão.
    tags: [federal, datasus, prioritario, spa]
    seeds:
      - url: "https://meususdigital.saude.gov.br/"
        label: "Página inicial pública"
        critical: true
        notes: >-
          Aplicação de página única em Angular: o conteúdo só existe após
          execução de JavaScript. O HTML servido é uma casca de 1418 bytes.
      - url: "https://meususdigital.saude.gov.br/login"
        label: "Autenticação gov.br"
        critical: true
        requires_auth: true
        notes: >-
          Excluída da varredura. A área autenticada concentra as telas de maior
          risco (resultado de exame, carteira de vacinação) e sua ausência é
          uma limitação declarada do estudo — não uma omissão.

  - id: gov-br-saude
    name: "Portal gov.br — área de Saúde"
    organization: "Ministério da Saúde"
    sphere: federal
    categories: [informacional, transparencia]
    base_url: "https://www.gov.br/saude/pt-br"
    territory: "Brasil"
    enabled: true
    selection_rationale: >-
      Portal construído sobre o Padrão Digital de Governo, que já incorpora
      requisitos de acessibilidade. Serve de referência superior: se o padrão
      oficial falha, a falha nos portais locais deixa de ser exceção
      administrativa e passa a ser problema sistêmico.
    robots_note: >-
      Verificado em 16/08/2026: robots.txt válido, 14 diretivas, permite a
      coleta das sementes declaradas.
    tags: [federal, padrao-digital-gov, referencia]
    seeds:
      - url: "https://www.gov.br/saude/pt-br"
        label: "Página inicial"
      - url: "https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z"
        label: "Índice temático de saúde"
      - url: "https://www.gov.br/saude/pt-br/composicao/saes"
        label: "Secretaria de Atenção Especializada à Saúde"

  # ---------------------------------------------------------------------------
  # 3. Esfera estadual — Rio de Janeiro
  # ---------------------------------------------------------------------------
  - id: ses-rj
    name: "Secretaria de Estado de Saúde do Rio de Janeiro"
    organization: "SES-RJ"
    sphere: estadual
    categories: [informacional, ouvidoria, resultado_exame, transparencia]
    base_url: "https://www.rj.gov.br/saude"
    territory: "RJ/Estado"
    population_served: 16000000
    enabled: true
    selection_rationale: >-
      Nível estadual de gestão do SUS, responsável pela regulação de leitos e
      pela ouvidoria estadual. Permite testar a hipótese de gradiente de
      conformidade entre as três esferas federativas.
    robots_note: >-
      Verificado em 16/08/2026 na origem de cada host. www.rj.gov.br: robots.txt
      válido, "User-agent: * / Disallow:" — permissão irrestrita.
      saude.rj.gov.br: HTTP 404, ausente. Política do projeto: ausência não
      expressa proibição, e tratá-la como tal impediria auditar justamente os
      portais mais precários.
    tags: [estadual, rj, dois-hosts]
    seeds:
      # O alvo abrange dois hosts do mesmo órgão: o portal institucional migrou
      # para www.rj.gov.br/saude, mas os serviços ao cidadão permaneceram no
      # subdomínio saude.rj.gov.br. Sementes explícitas tornam a mistura
      # deliberada e auditável, em vez de acidental.
      - url: "https://www.rj.gov.br/saude/"
        label: "Portal institucional — índice, sem serviço transacional"
        notes: >-
          Caracterização medida em 19/08/2026: 1 formulário (busca), 1 campo
          preenchível, 234 links, 31 domínios externos. É portal de índice,
          organizado por público (cidadão, servidor, gestor, pesquisador,
          imprensa, prestador). Não presta serviço ao cidadão diretamente."
      - url: "https://www.saude.rj.gov.br/ouvidoria/participe"
        label: "Ouvidoria — canal de manifestação do cidadão"
        critical: true
        notes: >-
          Caracterização medida em 19/08/2026: 5 formulários e 7 campos
          preenchíveis. É a ÚNICA das três sementes do estrato estadual com
          transação real — e a única que responde a todas as origens de rede
          testadas. As outras duas são índices. O estrato estadual está, na
          prática, representado por uma página transacional; a comparação entre
          esferas precisa declarar isso.
      - url: "https://www.saude.rj.gov.br/laudos"
        label: "Laudos e resultados de exames — índice de encaminhamento"
        critical: true
        notes: >-
          CORRIGIDO em 19/08/2026. A descrição anterior — "entrega resultado
          laboratorial ao cidadão" — estava errada. A página redireciona para
          www.rj.gov.br/saude/laudos e é um ÍNDICE com cinco cartões (RIOIMAGEM,
          RIOIMAGEM Baixada, Mamógrafo Móvel, Tomógrafo Móvel, Teste do
          Pezinho). Não entrega laudo algum: encaminha a sistemas distintos, com
          login próprio, entre eles clickexame.com e pixeon.clickvita.com.br —
          plataformas privadas. Caracterização medida: 1 formulário (a busca do
          portal), 1 campo preenchível, 104 links, 24 domínios externos.

          Duas consequências para o estudo. A auditoria mede aqui um índice de
          links, e não o serviço de resultado — o artigo precisa descrevê-lo
          assim. E a etapa final da jornada do cidadão ocorre em plataforma
          privada não auditada, embora igualmente obrigada pelo art. 63 da LBI,
          que alcança empresas com sede ou representação comercial no País: o
          dever segue o serviço, não o domínio.

  # ---------------------------------------------------------------------------
  # 4. Esfera municipal — Rio de Janeiro
  # ---------------------------------------------------------------------------
  - id: sms-rio
    name: "Secretaria Municipal de Saúde do Rio de Janeiro — seção informativa"
    organization: "SMS Rio / Prefeitura da Cidade do Rio de Janeiro"
    sphere: municipal
    categories: [informacional]
    base_url: "https://prefeitura.rio/saude"
    territory: "RJ/Capital"
    population_served: 6700000
    enabled: true
    selection_rationale: >-
      Seção de saúde do portal da capital, onde se concentra a população
      periférica que constitui o objeto central do estudo. A verificação de
      16/08/2026 revelou que a seção é um arquivo de notícias ("Arquivos
      Saúde"), e não um portal de serviços: a categoria foi corrigida de
      transacional para informacional. O achado é relevante em si — o cidadão
      que procura "saúde" no portal do município encontra jornalismo
      institucional, não serviço.
    robots_note: >-
      Verificado em 16/08/2026 na origem: robots.txt válido, bloqueia apenas
      /wp-admin/. As sementes declaradas são permitidas.
    tags: [municipal, rj, prioritario, noticias]
    seeds:
      - url: "https://prefeitura.rio/saude/"
        label: "Seção de saúde do portal municipal"
        critical: true

  - id: carioca-rio-saude
    name: "Carioca Digital — catálogo de serviços de saúde"
    organization: "Prefeitura da Cidade do Rio de Janeiro / SMS Rio"
    sphere: municipal
    categories: [informacional, agendamento, cadastro]
    base_url: "https://carioca.rio"
    territory: "RJ/Capital"
    population_served: 6700000
    enabled: true
    selection_rationale: >-
      Plataforma onde efetivamente residem os serviços municipais de saúde ao
      cidadão, identificada na verificação de 16/08/2026 como destino real dos
      fluxos transacionais que a seção de saúde do portal municipal não oferece.
      Sem ela, o estrato municipal ficaria representado apenas por conteúdo
      informativo, e a comparação entre esferas mediria coisas diferentes.
    robots_note: >-
      Verificado em 16/08/2026 na origem: robots.txt presente e vazio
      (0 bytes) — sem qualquer restrição.
    tags: [municipal, rj, transacional, servicos]
    seeds:
      - url: "https://carioca.rio/tema/saude/"
        label: "Catálogo de serviços de saúde"
        critical: true
      - url: "https://carioca.rio/servicos/atendimento-em-unidades-de-pronto-atendimento-upa-24-horas/"
        label: "Atendimento em UPA 24 horas — ficha de serviço"
        critical: true

  - id: subpav-rio
    name: "Subsecretaria de Promoção, Atenção Primária e Vigilância em Saúde"
    organization: "SUBPAV / SMS Rio"
    sphere: municipal
    categories: [informacional]
    base_url: "https://subpav.org"
    territory: "RJ/Capital"
    enabled: false
    selection_rationale: >-
      Integrava a amostra como canal operacional da atenção primária carioca,
      com conteúdo dirigido ao usuário. DESABILITADO em 16/08/2026: a
      verificação constatou que ambas as sementes redirecionam para
      subpav.org/aps/, hoje descrito como "repositório de conteúdo técnico" —
      dirigido a profissionais de saúde, não ao cidadão. Auditá-lo mediria a
      acessibilidade de um canal que deixou de ser de atendimento ao público, o
      que distorceria a comparação entre esferas. Mantido no catálogo porque a
      mudança de função é, ela própria, informação sobre o ecossistema: um canal
      antes voltado ao usuário deixou de sê-lo, sem substituto anunciado.
    robots_note: >-
      Verificado em 16/08/2026: robots.txt ausente (HTTP 404); ambas as sementes
      redirecionam para /aps/.
    tags: [municipal, rj, atencao-primaria, desabilitado-mudanca-de-funcao]
    seeds:
      - url: "https://subpav.org/aps/"
        label: "Repositório de conteúdo técnico (antigo portal da APS)"
